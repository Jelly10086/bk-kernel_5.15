name: build bkk

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '内核版本: 如5.15.xxx_bkk-CaT_b4，xxx为占位符 留空使用仓库版本'
        required: false
        default: ''
        type: string
      jobs:
        description: 并行任务数，留空则自动计算
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: sheng-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      ak3-artifact: ${{ steps.ak3.outputs.artifact-id }}
      control-artifact: ${{ steps.control.outputs.artifact-id }}
      perf-artifact: ${{ steps.perf.outputs.artifact-id }}
      metadata-artifact: ${{ steps.metadata.outputs.artifact-id }}
    env:
      OUT_DIR: ${{ github.workspace }}/kr-build/out
      DIST_DIR: ${{ github.workspace }}/kr-build/dist
      JOBS: ${{ inputs.jobs }}
      CCACHE: ccache
      CCACHE_DIR: ${{ github.workspace }}/kr-build/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2GiB
    steps:
      - name: Checkout kernel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set kernel version
        if: inputs.version_name != ''
        env:
          PACKAGE_VERSION: ${{ inputs.version_name }}
        run: |
          version=$(bash kr-build/set-version.sh --print "$PACKAGE_VERSION")
          printf 'PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Checkout pinned BakaSU with history
        run: git submodule update --init KernelSU

      - name: Prepare hosted runner
        run: |
          set -euo pipefail
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl dwarves flex git \
            kmod libelf-dev libssl-dev pkg-config python3 rsync zlib1g-dev
          source kr-build/pins.env
          {
            printf 'CLANG_DIR=%s/GoogleClang\n' "$RUNNER_TEMP"
            printf 'CLANG_COMMIT=%s\nCLANG_PACKAGE=%s\n' "$CLANG_COMMIT" "$CLANG_PACKAGE"
            printf 'ANYKERNEL_COMMIT=%s\n' "$ANYKERNEL_COMMIT"
          } >> "$GITHUB_ENV"
          swap_kib=$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)
          target_swap_kib=$((24 * 1024 * 1024))
          if (( swap_kib < target_swap_kib )); then
            swap_gib=$(( (target_swap_kib - swap_kib + 1048575) / 1048576 ))
            available_kib=$(df -k --output=avail "$RUNNER_TEMP" | tail -n 1)
            if (( available_kib < (swap_gib + 20) * 1048576 )); then
              printf '[ERROR] 磁盘空间不足，无法增加 swap 并保留构建空间\n' >&2
              exit 1
            fi
            sudo fallocate -l "${swap_gib}G" "$RUNNER_TEMP/kr-build.swap"
            sudo chmod 600 "$RUNNER_TEMP/kr-build.swap"
            sudo mkswap "$RUNNER_TEMP/kr-build.swap"
            sudo swapon "$RUNNER_TEMP/kr-build.swap"
          fi
          df -h .
          free -h

      - name: Restore Google Clang cache
        id: clang-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CLANG_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-clang-v1-${{ env.CLANG_COMMIT }}-${{ env.CLANG_PACKAGE }}

      - name: Fetch or validate pinned Google Clang
        run: bash kr-build/fetch-clang.sh

      - name: Save Google Clang cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CLANG_DIR }}
          key: ${{ steps.clang-cache.outputs.cache-primary-key }}

      - name: Cache AnyKernel3 template
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: kr-build/.cache/anykernel-${{ env.ANYKERNEL_COMMIT }}
          key: ${{ runner.os }}-anykernel-v1-${{ env.ANYKERNEL_COMMIT }}

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-sheng-ccache-v1-${{ env.CLANG_COMMIT }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sheng-ccache-v1-${{ env.CLANG_COMMIT }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Build and package
        id: build
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python3 -u - "$OUT_DIR/resources.log" "$$" <<'PY' &
          import datetime
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time

          def stop(signum, frame):
              raise SystemExit(0)

          signal.signal(signal.SIGTERM, stop)
          signal.signal(signal.SIGINT, stop)
          parent = int(sys.argv[2])
          with open(sys.argv[1], 'w', encoding='utf-8', buffering=1) as log:
              while os.getppid() == parent:
                  memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
                  vmstat = dict(line.split() for line in Path('/proc/vmstat').read_text().splitlines())
                  stamp = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')
                  fields = ' '.join(f'{key}={memory[key].strip()}' for key in ('MemAvailable', 'SwapTotal', 'SwapFree'))
                  lines = [f'[RESOURCE] {stamp} - {fields} oom_kill={vmstat.get("oom_kill", "unknown")}']
                  for source in ('/proc/pressure/memory', '/sys/fs/cgroup/memory.events'):
                      try:
                          lines.append(f'{source}: {Path(source).read_text().strip().replace(chr(10), "; ")}')
                      except OSError:
                          pass
                  try:
                      processes = subprocess.run(
                          ['ps', '-eo', 'pid,ppid,comm,rss', '--sort=-rss'],
                          text=True, capture_output=True, timeout=5, check=True,
                      )
                      lines.extend(processes.stdout.splitlines()[:6])
                  except (OSError, subprocess.SubprocessError) as error:
                      lines.append(f'ps: {error}')
                  sample = '\n'.join(lines) + '\n'
                  log.write(sample)
                  print(sample, end='', flush=True)
                  time.sleep(15)
          PY
          monitor_pid=$!
          stop_monitor() {
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
          }
          trap stop_monitor EXIT
          bash kr-build/build.sh

      - name: Record kernel diagnostics
        if: always()
        run: |
          mkdir -p "$OUT_DIR"
          sudo dmesg --time-format iso > "$OUT_DIR/runner-dmesg.log" || true
          free -h
          df -h .
          grep -Ei 'out of memory|oom-kill|killed process' "$OUT_DIR/runner-dmesg.log" || true

      - name: Show compiler cache statistics
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        run: ccache --show-stats

      - name: Save compiler cache
        if: always() && !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Upload flashable AK3
        id: ak3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: kr-build/dist/*/*-AK3-??????.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload bkk-control module
        id: control
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: kr-build/dist/*/bkk-control-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload ash mode LKM
        id: perf
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: kr-build/dist/*/bkk-ash-mode-*.ko
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Prepare build metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$DIST_DIR"/*/*-AK3-??????.zip)
          (( ${#packages[@]} == 1 )) || { printf '[ERROR] 需要唯一的 AK3 安装包\n' >&2; exit 1; }
          bundle=$(dirname -- "${packages[0]}")
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          controls=("$DIST_DIR"/*/bkk-control-*.zip)
          (( ${#controls[@]} == 1 )) || { printf '[ERROR] 需要唯一的控制模块包\n' >&2; exit 1; }
          control_bundle=$(dirname -- "${controls[0]}")
          (cd "$control_bundle" && sha256sum --check bkk-control-SHA256SUMS)
          python3 - "${packages[0]}" "${controls[0]}" <<'PY'
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as kernel, zipfile.ZipFile(sys.argv[2]) as control:
              assert [n for n in kernel.namelist() if n.endswith('.ko')] == ['allocator/zsmalloc.ko']
              assert not any(n.startswith(('module/', 'modules/')) for n in kernel.namelist())
              assert not any(n.startswith(('Image', 'tools/', 'META-INF/')) for n in control.namelist())
              assert 'bkk_perf.ko' in control.namelist()
              assert kernel.read('allocator/zsmalloc.ko') == control.read('zsmalloc/zsmalloc.ko')
              assert kernel.read('allocator/build-info.txt') == control.read('zsmalloc/build-info.txt')
          PY
          mkdir -p "$RUNNER_TEMP/release-metadata"
          cp -- "$bundle"/{SHA256SUMS,kernel.release,build-info.txt,gki.config,Module.symvers,zsmalloc-build-info.txt} "$RUNNER_TEMP/release-metadata/"
          cp -- "$control_bundle"/{bkk-control-SHA256SUMS,bkk-control-build-info.txt} "$RUNNER_TEMP/release-metadata/"

      - name: Upload checksums and build metadata
        id: metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sheng-build-files-${{ github.run_number }}
          path: ${{ runner.temp }}/release-metadata/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sheng-build-log-${{ github.run_number }}
          path: |
            kr-build/out/build.log
            kr-build/out/build-info.txt
            kr-build/out/.config
            kr-build/out/.kr-build-result
            kr-build/out/resources.log
            kr-build/out/runner-dmesg.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download flashable AK3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.ak3-artifact }}
          path: ${{ runner.temp }}/release
          skip-decompress: true

      - name: Download checksums and build metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.metadata-artifact }}
          path: ${{ runner.temp }}/release

      - name: Download bkk-control module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.control-artifact }}
          path: ${{ runner.temp }}/release
          skip-decompress: true

      - name: Download ash mode LKM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.perf-artifact }}
          path: ${{ runner.temp }}/release
          skip-decompress: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          sha256sum --check bkk-control-SHA256SUMS
          grep -qx "KERNEL_COMMIT=$GITHUB_SHA" build-info.txt
          grep -qx "KERNEL_COMMIT=$GITHUB_SHA" bkk-control-build-info.txt
          grep -qx "KERNEL_RELEASE=$(cat kernel.release)" bkk-control-build-info.txt
          shopt -s nullglob
          packages=(bkk-*-AK3-??????.zip)
          (( ${#packages[@]} == 1 )) || { printf '[ERROR] 需要唯一的 AK3 安装包\n' >&2; exit 1; }
          title=${packages[0]%.zip}
          tag="$title-build$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          {
            printf 'Kernel: `%s`\n\n' "$(cat kernel.release)"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf '[Build](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" --latest
